<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            background-color: white;
        }

        .grid-container {
            display: grid;
            width: 100%;
            height: 100vh;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto;
            gap: 4px;
            background-color: white;
        }

        .grid-item {
            background-color: #008000;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            display: flex;
            align-items: flex-start;
        }

        /* Grid item positions */
        .item-1 {
            grid-column: 1 / -1; /* Full width */
            height: 150px;
        }

        .item-2 {
            grid-row: 2 / 6;
            height: 600px;
        }

        .item-3, .item-4 {
            grid-row: 2;
            height: 150px;
        }

        .item-5 {
            grid-column: 2 / span 1;
            grid-row: 3;
            height: 150px;
        }

        .item-6 {
            grid-column: 3;
            grid-row: 3;
            height: 150px;
        }

        .item-7, .item-8, .item-9 {
            grid-row: 4;
            height: 150px;
        }

        .item-10 {
            grid-column: 2 / -1; /* Spans from column 2 to end */
            grid-row: 5;
            height: 150px;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item item-1">1</div>
        <div class="grid-item item-2">2</div>
        <div class="grid-item item-3">3</div>
        <div class="grid-item item-4">4</div>
        <div class="grid-item item-5">5</div>
        <div class="grid-item item-6">6</div>
        <div class="grid-item item-7">7</div>
        <div class="grid-item item-8">8</div>
        <div class="grid-item item-9">9</div>
        <div class="grid-item item-10">10</div>
    </div>
</body>
</html>
